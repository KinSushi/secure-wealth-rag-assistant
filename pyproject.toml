[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-wealth-rag-assistant"
version = "0.1.0"
description = "Synthetic secure RAG / LLMOps portfolio project with privacy controls and retrieval evaluation."
requires-python = ">=3.12"
dependencies = [
    "scikit-learn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
